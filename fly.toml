app = "bomb-breakers"          # cambia el nombre: debe ser único en Fly.io
primary_region = "mad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # las salas viven en memoria: no apagar la máquina
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
